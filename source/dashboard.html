<!doctype html>
<!-- data-theme is seeded to dark because that's the shipped default
     (config.example.json's window.dark_theme). The stylesheet's own :root
     is the light palette, so without this the window paints light for the
     moment before dashboard.js reads /settings.json and corrects it -- a
     flash on every launch. dashboard.js still owns the attribute after
     that and will set it to "light" if that's what the config says.

     Keep --surface-0 in each theme in step with widget.py's
     page_background: that value is what the native window paints in the
     sliver between body's rounded box and the window's clipped corners,
     and a mismatch shows as a seam. -->
<html lang="en" data-theme="dark" data-translucent="off">
<head>
<meta charset="utf-8">
<title>Tasks</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  /* Light palette. The dark block below redefines these same names and
     nothing downstream needs a variant, so the whole theme is one block
     of redefinitions. Borrowed wholesale from DesktopCards so the two
     widgets sit on one desktop without looking like different software. */
  /* Every colour below is a *-raw token, and nothing downstream paints
     with one directly: the --alpha-* block further down turns each into
     the var() name the rules actually use. That indirection is what makes
     translucency a token-layer change rather than an edit to every colour
     usage in the file. Ported from DesktopCards. */
  :root {
    color-scheme: light;
    --surface-0-raw:      #f3f4f6;  /* the page itself */
    --surface-1-raw:      #ffffff;  /* a list card */
    --surface-2-raw:      #e5e7eb;  /* dividers, the task ring */
    --text-primary-raw:   #1f2937;
    --text-secondary-raw: #374151;
    --text-muted-raw:     #6b7280;
    --text-faint-raw:     #9ca3af;
    --accent-raw:         #0078d4;  /* overridden from config.json */
    --error-raw:          #ef4444;
    --error-surface-raw:  #fef2f2;
    --overdue-raw:        #dc2626;
    --today-raw:          #b45309;
    --corner-radius:      16px;
    --scale:              1;
    /* One number for all four sides, then a per-side override on top.
       dashboard.js resolves which is in play; the CSS only ever reads
       the four. */
    --spacing:            0px;
    --spacing-left:       0px;
    --spacing-top:        0px;
    --spacing-right:      0px;
    --spacing-bottom:     0px;
  }

  /* Dark theme. Not black: the cards stay a step lighter than the page
     behind them, because that step is what makes them read as cards
     rather than regions of one dark sheet -- and a pure #000 page would
     make the rounded corners vanish into the wallpaper instead of
     floating on it. The hue is a cool blue-grey to match the light
     theme's slate text, so switching themes doesn't change the widget's
     temperature.

     Text runs dimmer rather than greyer: on dark surfaces, lowering
     lightness is what reads as hierarchy, where on white it's darkening.
     --text-primary stops short of #fff so titles don't bloom.

     color-scheme is set too, so the native scrollbar and anything else
     WebView2 draws come out dark instead of a light strip. */
  :root[data-theme="dark"] {
    color-scheme: dark;
    --surface-0-raw:      #1d2128;
    --surface-1-raw:      #292e37;
    --surface-2-raw:      #3e4651;
    --text-primary-raw:   #f2f4f7;
    --text-secondary-raw: #d5dbe3;
    --text-muted-raw:     #a2abb8;
    --text-faint-raw:     #7a8391;
    --error-raw:          #fa8585;
    --error-surface-raw:  #43282d;
    /* Lighter than the light theme's reds: a saturated #dc2626 on a dark
       card reads as a glowing dot rather than as text. */
    --overdue-raw:        #f87171;
    --today-raw:          #fbbf24;
  }

  /* Translucency (config.json's translucent_background and opacity).
     dashboard.js writes the three --alpha-* numbers; everything here just
     applies them. All three default to 1, which makes every color-mix
     below resolve to exactly its own raw token, so with translucency off
     this whole layer is a no-op.

     Three tiers, not one, because a single alpha applied uniformly reads
     as a faded screenshot rather than a translucent panel: the page
     backdrop takes the opacity in full, card faces take most of it, and
     text gives up only a fraction so it stays legible over wallpaper. The
     fractions live in dashboard.js (TRANSLUCENCY_TIERS), since they are
     arithmetic on one input rather than styling.

     color-mix against `transparent` is the mechanism. It takes a colour in
     any format and returns it at a fraction of its alpha, without needing
     the tokens broken into r/g/b. Resolution happens at use time, so this
     block sitting in plain :root still picks up the dark theme's raw
     values when that attribute is set. */
  :root {
    --alpha-page:    1;
    --alpha-surface: 1;
    --alpha-text:    1;
    --heading-darken: 0;

    --surface-0:      color-mix(in srgb, var(--surface-0-raw)      calc(var(--alpha-page) * 100%),    transparent);
    --surface-1:      color-mix(in srgb, var(--surface-1-raw)      calc(var(--alpha-surface) * 100%), transparent);
    --surface-2:      color-mix(in srgb, var(--surface-2-raw)      calc(var(--alpha-surface) * 100%), transparent);
    --error-surface:  color-mix(in srgb, var(--error-surface-raw)  calc(var(--alpha-surface) * 100%), transparent);
    --accent:         color-mix(in srgb, var(--accent-raw)         calc(var(--alpha-text) * 100%),    transparent);
    --error:          color-mix(in srgb, var(--error-raw)          calc(var(--alpha-text) * 100%),    transparent);
    --overdue:        color-mix(in srgb, var(--overdue-raw)        calc(var(--alpha-text) * 100%),    transparent);
    --today:          color-mix(in srgb, var(--today-raw)          calc(var(--alpha-text) * 100%),    transparent);
    --text-primary:   color-mix(in srgb, var(--text-primary-raw)   calc(var(--alpha-text) * 100%),    transparent);
    --text-secondary: color-mix(in srgb, var(--text-secondary-raw) calc(var(--alpha-text) * 100%),    transparent);
    --text-muted:     color-mix(in srgb, var(--text-muted-raw)     calc(var(--alpha-text) * 100%),    transparent);
    /* The header and the clock are the only text sitting on the page
       backdrop rather than on a card, so they are the only text whose
       real background is the wallpaper. A faint grey that reads as a quiet
       label on a solid page turns into haze over an arbitrary photo, so as
       the page disappears they are pulled toward near-black by
       --heading-darken. */
    --text-faint:     color-mix(in srgb,
                        color-mix(in srgb, #000 calc(var(--heading-darken) * 100%),
                                  var(--text-faint-raw))
                        calc(var(--alpha-text) * 100%), transparent);
  }

  /* Off is not cosmetic: it drops every color-mix out of the chain, which
     is both cheaper and exactly what the plain raw tokens already mean. */
  :root[data-translucent="off"] {
    --surface-0: var(--surface-0-raw);
    --surface-1: var(--surface-1-raw);
    --surface-2: var(--surface-2-raw);
    --error-surface: var(--error-surface-raw);
    --accent: var(--accent-raw);
    --error: var(--error-raw);
    --overdue: var(--overdue-raw);
    --today: var(--today-raw);
    --text-primary: var(--text-primary-raw);
    --text-secondary: var(--text-secondary-raw);
    --text-muted: var(--text-muted-raw);
    --text-faint: var(--text-faint-raw);
  }

  * { box-sizing: border-box; }

  /* No scrollbars, ever. The window is pinned to the desktop layer and
     receives no mouse input, so a scrollbar is a control that can be seen
     and never used. It also steals horizontal space from the layout and
     makes the page a few pixels narrower than the window it is measuring
     itself against.

     Nothing is lost by hiding them. The window resizes itself to the full
     content height after every render (fitWindowToContent), so there is
     never anything below the fold to scroll to. If a scrollbar does
     appear, the resize is wrong and that is the bug to fix, not the
     scrollbar. */
  html, body {
    margin: 0;
    background: var(--surface-0);
    overflow: hidden;
    scrollbar-width: none;        /* Firefox, and WebView2 honours it */
  }
  html::-webkit-scrollbar, body::-webkit-scrollbar { display: none; }
  body {
    color: var(--text-primary);
    font: 13px/1.45 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    /* Nothing in here is selectable or draggable. The window is pinned to
       the desktop layer and receives no mouse input at all, so a text
       cursor or a drag ghost would be a promise the widget cannot keep.
       Also keeps a stray selection from surviving a reload. */
    user-select: none;
    cursor: default;
  }

  /* One column's design width, and the gap between columns. The shell
     grows with the column count, which dashboard.js sets on <html> after
     it decides how many there are, and then asks the window to match.
     Keep --col-width in step with dashboard.js's BASE_WIDTH and with
     widget.py's WINDOW_WIDTH, which is the single-column case. */
  :root { --columns: 1; --col-width: 325px; --col-gap: 10px; }

  #shell {
    width: calc(var(--col-width) * var(--columns)
                + var(--col-gap) * (var(--columns) - 1)
                + var(--spacing-left) + var(--spacing-right));
    padding: calc(14px + var(--spacing-top)) calc(14px + var(--spacing-right))
             calc(14px + var(--spacing-bottom)) calc(14px + var(--spacing-left));
    /* zoom rather than transform: scale. transform leaves the element's
       layout box at its original size, so the window would be sized for
       unscaled content and clip or leave a gap. zoom changes layout, so
       getBoundingClientRect reports the real painted size and the window
       fits it. */
    zoom: var(--scale);
  }

  /* The columns themselves. A grid rather than CSS columns: these are
     whole lists assigned to a specific column by dashboard.js, not a
     stream of text to be balanced, and a balancing algorithm would undo
     that assignment. align-items start keeps a short column's cards at
     the top instead of stretching them down to match the tallest. */
  #lists {
    display: grid;
    grid-template-columns: repeat(var(--columns), 1fr);
    gap: 0 var(--col-gap);
    align-items: start;
  }
  .column { min-width: 0; }

  /* The footer when max_tasks cut the render short. */
  .more {
    grid-column: 1 / -1;
    color: var(--text-faint);
    font-size: 11.5px;
    text-align: center;
    padding-top: 8px;
  }

  /* ---------------------------------------------------------- header */
  header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin: 0 2px 10px;
  }
  h1 {
    margin: 0;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.01em;
    color: var(--text-secondary);
  }
  /* The countdown and clock. Sits on the page backdrop rather than on a
     card, like DesktopCards' "updated" label. */
  #updated {
    font-size: 11px;
    color: var(--text-faint);
    font-variant-numeric: tabular-nums;
  }

  /* ----------------------------------------------------------- lists */
  .list {
    background: var(--surface-1);
    border-radius: var(--corner-radius);
    padding: 10px 12px;
    margin-bottom: 8px;
  }
  .list:last-child { margin-bottom: 0; }

  .list-title {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text-muted);
    margin-bottom: 7px;
  }
  /* Ungrouped mode (group_by_list false) renders one card with no title,
     so the padding that would sit under the heading is given back. */
  .list.untitled { padding-top: 12px; }

  /* ----------------------------------------------------------- tasks */
  .task {
    display: flex;
    align-items: flex-start;
    gap: 8px;
    padding: 3px 0;
  }

  /* A ring, not a checkbox. Deliberate: the widget is read-only and the
     desktop layer cannot be clicked, so anything shaped
     like a control would invite a click that silently does nothing. This
     is a bullet that happens to echo the Google Tasks visual. */
  .dot {
    flex: 0 0 auto;
    width: 11px;
    height: 11px;
    margin-top: 4px;
    border: 1.5px solid var(--surface-2);
    border-radius: 50%;
  }
  .task.overdue .dot { border-color: var(--overdue); }
  .task.today   .dot { border-color: var(--today); }

  .body { min-width: 0; flex: 1 1 auto; }

  .title {
    color: var(--text-primary);
    /* Wraps rather than truncating. A task whose title is cut off is a
       task you have to open another app to read, which defeats the point
       of having it on the desktop; the window grows instead. */
    overflow-wrap: anywhere;
  }

  .notes {
    margin-top: 1px;
    font-size: 11.5px;
    color: var(--text-muted);
    overflow-wrap: anywhere;
    /* Two lines, then ellipsis. Notes are reference material, not the
       task -- an essay pasted into one shouldn't push every other task
       off the bottom of the widget. */
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .due {
    margin-top: 1px;
    font-size: 11px;
    color: var(--text-faint);
    font-variant-numeric: tabular-nums;
  }
  .task.overdue .due { color: var(--overdue); font-weight: 600; }
  .task.today   .due { color: var(--today);   font-weight: 600; }

  /* Subtasks. Indented by the dot's width plus its gap, so a child's text
     starts where its parent's text does -- the nesting reads off the text
     column, not off a rule. */
  .children { margin-left: 19px; }

  /* ----------------------------------------------- empty + error states */
  /* An empty list is a success, not a failure, and should read like one. */
  .empty {
    color: var(--text-faint);
    font-size: 12px;
    padding: 1px 0 2px;
  }

  .notice {
    background: var(--error-surface);
    border-radius: var(--corner-radius);
    padding: 10px 12px;
    margin-bottom: 8px;
    color: var(--error);
    font-size: 12px;
  }
  .notice strong { display: block; font-size: 12px; margin-bottom: 2px; }
  /* How to fix it. Muted rather than red: the instruction is calm even
     when the state above it isn't. */
  .notice .how { color: var(--text-muted); margin-top: 3px; }
</style>
</head>
<body>
<div id="shell">
  <header>
    <h1>Tasks</h1>
    <span id="updated"></span>
  </header>
  <!-- AUTH_EXPIRED / FETCH_FAILED land here, above the tasks: the tasks
       below them are the previous fetch's, kept on purpose by
       google_tasks.main() so the widget shows a stale list plus a prompt
       rather than going blank. -->
  <div id="notices"></div>
  <div id="lists"></div>
</div>
<script src="dashboard.js"></script>
</body>
</html>
